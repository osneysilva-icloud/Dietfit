    <!-- Crisp Vein & Stem -->
    <path d="M5 32 C5 28 7.5 24.5 12 23.5 C16 22.8 19.5 20.5 21 19" 
          stroke="#FAF7F0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M12 23.5 C13.5 19.5 17.5 17 21.5 16" 
          stroke="#FAF7F0" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.8" fill="none"/>
