    <!-- Main Leaf Blade -->
    <path d="M18 31 C7.5 31 4 20 5.5 12 C13.5 10.5 25 8 28 4 C29.5 7 31 10.5 31 16 C31 24 24.5 31 18 31 Z" 
          fill="url(#leafGrad)"/>
    
